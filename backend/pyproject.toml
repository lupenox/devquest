[project]
name = "devquest-backend"
version = "0.1.0"
description = "DevQuest: Local-first Neovim + zyBooks + RPG programming mastery backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "lxml>=5.3.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
